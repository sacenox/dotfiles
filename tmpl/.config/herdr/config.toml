# ~/.config/herdr/config.toml
# Palette values come from the profile under `herdr` in values/<profile>.json.
# Reference: herdr --default-config

onboarding = false

[theme]
name = "{{ herdr.theme }}"

# Base theme tokens overridden with the profile palette.
[theme.custom]
sidebar_bg    = "{{ herdr.colors.sidebar_bg }}"
panel_bg      = "{{ herdr.colors.panel_bg }}"
active_row_bg = "{{ herdr.colors.active_row_bg }}"
selection_bg  = "{{ herdr.colors.selection_bg }}"
surface_dim   = "{{ herdr.colors.surface_dim }}"
surface0      = "{{ herdr.colors.surface0 }}"
surface1      = "{{ herdr.colors.surface1 }}"
overlay0      = "{{ herdr.colors.overlay0 }}"
overlay1      = "{{ herdr.colors.overlay1 }}"
text          = "{{ herdr.colors.text }}"
subtext0      = "{{ herdr.colors.subtext0 }}"
accent        = "{{ herdr.colors.accent }}"
mauve         = "{{ herdr.colors.mauve }}"
green         = "{{ herdr.colors.green }}"
yellow        = "{{ herdr.colors.yellow }}"
red           = "{{ herdr.colors.red }}"
blue          = "{{ herdr.colors.blue }}"
teal          = "{{ herdr.colors.teal }}"
peach         = "{{ herdr.colors.peach }}"

[terminal]
# Empty means $SHELL, then /bin/sh.
default_shell = ""
kitty_graphics = true

[ui]
accent = "{{ herdr.colors.accent }}"

[session]
resume_agents_on_restore = true
