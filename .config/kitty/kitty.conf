## Kitty config
## author: @sacenox

enabled_layouts splits
map ctrl+shift+enter launch --location=vsplit

cursor_trail 1
cursor_trail_decay 0.1 0.2
enable_audio_bell no
remember_window_size  no
initial_window_width  120c
initial_window_height 40c

# Uncomment for blurred transparent bg
# background_opacity 0.9
# background_blur 1
# Uncomment for no titlebar
hide_window_decorations yes
window_padding_width 10

disable_ligatures always
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12
font_family JetBrains Mono Nerd Font
modify_font cell_height 120%

# No bs simple tabbar with + button and reasonable padding
tab_bar_style separator
tab_separator ""
tab_bar_margin_height 0 0
# leading/trailing spaces in the template are the tab's horizontal padding
tab_title_template "  {fmt.fg.red}{bell_symbol}{fmt.fg.tab}{title}  "

