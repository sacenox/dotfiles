# Shift+Enter splits vertically
enabled_layouts splits
map ctrl+shift+enter launch --location=vsplit

# Fancy cursor and other preferences
cursor_trail 1
cursor_trail_decay 0.1 0.2
enable_audio_bell no
remember_window_size  no
window_padding_width 2
window_padding_height 2
initial_window_width  120c
initial_window_height 40c
disable_ligatures always
bold_font auto
italic_font auto
bold_italic_font auto

# Font stuff
font_size 12
font_family Lilex Nerd Font

# Jellybeans colors
color0 #929292
color1 #e27373
color2 #94b979
color3 #ffba7b
color4 #97bedc
color5 #e1c0fa
color6 #00988e
color7 #dedede
color8 #bdbdbd
color9 #ffa1a1
color10 #bddeab
color11 #ffdca0
color12 #b1d8f6
color13 #fbdaff
color14 #1ab2a8
color15 #ffffff
background #121212
selection_foreground #121212
cursor #ffa560
cursor_text_color #ffffff
foreground #dedede
selection_background #dedede
